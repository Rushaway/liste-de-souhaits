<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nos listes de souhaits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #24352A;
    --color-bg-deep: #1C2921;
    --color-card: #F1E7D2;
    --color-ink: #2B2418;
    --color-ink-soft: #5B5340;
    --color-gold: #C9A24C;
    --color-rust: #A6452F;
    --color-cream: #F4ECDA;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    background-image: radial-gradient(ellipse at top, var(--color-bg) 0%, var(--color-bg-deep) 100%);
    font-family: var(--font-body);
    color: var(--color-cream);
    -webkit-font-smoothing: antialiased;
    padding: 2rem 1.2rem;
  }
  .wrap { text-align: center; max-width: 640px; width: 100%; }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 3rem);
    margin: 0 0 0.6rem;
  }
  p.lead { color: #D8CFB8; line-height: 1.6; margin: 0 auto 2.4rem; max-width: 42ch; }
  .cards { display: grid; gap: 1.4rem; grid-template-columns: 1fr 1fr; }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
  a.card {
    display: block;
    background: var(--color-card);
    color: var(--color-ink);
    text-decoration: none;
    border-radius: 4px 18px 4px 18px;
    padding: 2rem 1.4rem;
    box-shadow: 0 14px 26px -14px rgba(15,20,15,0.45);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-5px);
    box-shadow: 0 20px 34px -14px rgba(15,20,15,0.5);
  }
  a.card .who {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.5rem;
    display: block;
    margin-bottom: 0.3rem;
  }
  a.card .go {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--color-rust);
    font-size: 0.95rem;
  }
  :focus-visible { outline: 2px solid var(--color-gold); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Nos listes de souhaits</h1>
    <p class="lead">Deux listes, une seule adresse. Choisis la bonne étiquette.</p>
    <div class="cards">
      <a class="card" href="./nicolas/">
        <span class="who">Nicolas 💛</span>
        <span class="go">voir la liste ↗</span>
      </a>
      <a class="card" href="./lucile/">
        <span class="who">Lucile ❤️</span>
        <span class="go">voir la liste ↗</span>
      </a>
    </div>
  </div>
</body>
</html>
